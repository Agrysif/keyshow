<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <!-- Промо-ролик KeyShow. Рендерится покадрово: npx electron promo/render.js -->
  <title>KeyShow promo</title>
  <link rel="stylesheet" href="../src/keycaps.css">
  <link rel="stylesheet" href="promo.css">
  <script src="clock.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "../node_modules/three/build/three.module.js",
        "three/addons/": "../node_modules/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="frame">
    <canvas id="gl" width="1920" height="1080"></canvas>

    <div id="app" class="scene">
      <div id="appInner">
        <div class="topbar">
          <div class="tb-group"><span class="tb-tool on"></span><span class="tb-tool"></span><span class="tb-tool"></span><span class="tb-tool"></span><span class="tb-tool"></span></div>
          <div class="tb-title">Drafts / <b>Landing page</b></div>
          <div class="tb-group"><span class="avatar"></span><span class="share">Share</span></div>
        </div>
        <div class="main">
          <aside class="panel left">
            <h4>Layers</h4>
            <div class="layer-row"><i></i><span style="width:140px"></span></div>
            <div class="layer-row"><i></i><span style="width:104px"></span></div>
            <div class="layer-row sel"><i></i><span style="width:128px"></span></div>
            <div class="layer-row"><i></i><span style="width:84px"></span></div>
            <div class="layer-row"><i></i><span style="width:150px"></span></div>
            <div class="layer-row"><i></i><span style="width:96px"></span></div>
            <div class="layer-row"><i></i><span style="width:118px"></span></div>
          </aside>
          <div class="canvas">
            <div class="artboard" id="artboard">
              <div class="ab-label">Desktop — 1440</div>
              <div class="ab-nav"><i style="width:110px"></i><i style="width:260px"></i></div>
              <div class="ab-h1"></div>
              <div class="ab-h1 short"></div>
              <div class="ab-p" style="width:88%"></div>
              <div class="ab-p" style="width:70%"></div>
              <div class="ab-row"><div class="ab-btn" id="cta"></div><div class="ab-btn ghost"></div></div>
              <div class="ab-cards">
                <div style="background:linear-gradient(135deg,#FFD60A,#FF9F0A)"></div>
                <div id="card2" style="background:linear-gradient(135deg,#64D2FF,#5E5CE6)"></div>
                <div style="background:linear-gradient(135deg,#30D158,#64D2FF)"></div>
              </div>
            </div>
          </div>
          <aside class="panel right">
            <h4>Design</h4>
            <div class="prop"><span></span><span></span><span></span><span></span></div>
            <h4>Fill</h4>
            <div class="swatch-row"><span style="background:#5E5CE6"></span><span style="background:#F2F2F7"></span></div>
            <h4>Effects</h4>
            <div class="prop"><span></span><span></span></div>
          </aside>
        </div>
        <div class="overlay ks-root" id="ovRoot">
          <div id="fx" class="ks-fx"></div>
          <div id="stage"></div>
          <div class="fake-cursor" id="cursor"><svg viewBox="0 0 14 21"><path d="M1 1v15.6l4-3.9 2.9 6.4 2.5-1.1-2.8-6.3h5.6Z" fill="#fff" stroke="#000" stroke-width="1.1" stroke-linejoin="round"/></svg></div>
        </div>
      </div>
    </div>

    <div id="styles" class="scene">
      <div class="tile dark" data-style="solid" data-color="#0A84FF"></div>
      <div class="tile photo" data-style="glass" data-color="#5E5CE6"></div>
      <div class="tile canvas-bg" data-style="light" data-color="#FF375F"></div>
      <div class="tile white" data-style="dark" data-color="#FF9F0A"></div>
    </div>

    <div id="langs" class="scene">
      <div class="lang-box"><div id="langWord"></div><div id="langSub"></div></div>
    </div>

    <div id="endcard" class="scene">
      <div class="end-text">
        <div id="endTitle">KeyShow</div>
        <div id="endSub">Показ нажатий для обучающих видео</div>
        <div id="endPills"><span class="accent">Бесплатно</span><span>Windows</span><span>12 языков</span><span>github.com/Agrysif/keyshow</span></div>
      </div>
    </div>

    <div id="caption"></div>
    <div id="vignette"></div>
    <div id="flash"></div>
  </div>

  <script src="../src/locales/ru.js"></script>
  <script src="../src/locales/en.js"></script>
  <script src="../src/locales/be.js"></script>
  <script src="../src/locales/kk.js"></script>
  <script src="../src/locales/ky.js"></script>
  <script src="../src/locales/tt.js"></script>
  <script src="../src/locales/tg.js"></script>
  <script src="../src/locales/uz.js"></script>
  <script src="../src/locales/az.js"></script>
  <script src="../src/locales/hy.js"></script>
  <script src="../src/locales/ro.js"></script>
  <script src="../src/locales/tk.js"></script>
  <script src="../src/i18n.js"></script>
  <script src="../src/keys.js"></script>
  <script src="../src/engine.js"></script>
  <script type="module" src="promo.js"></script>
</body>
</html>
